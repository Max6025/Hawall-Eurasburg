<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Weihnachten – Vorschau</title>
<!--
  Das Weihnachtsdesign mit echten Karten: dieselben CSS-Dateien, dasselbe Render-Modul, dasselbe
  anlass.js wie auf der Wand, und DIESELBE Verschachtelung (.main > .grid bzw.
  .bildschirmschoner > .bs-inhalt > .bs-karten) -- nur so gelten die Abstaende, die das Design
  dem Raster gibt. Ohne Home Assistant, ohne Electron, ohne Geraet.

    (ohne)              -- der BILDSCHIRMSCHONER: grosse Szene mit Baum, Schild, Haus, Schneemann.
                           Das ist die Flaeche, die auf der Wand fast immer zu sehen ist.
    ?dashboard          -- das Dashboard: kleine Szene, unten der Streifen mit der Uhr
    ?tag                -- Tag statt Nacht (nur auf dem Dashboard; der Schoner ist immer Nacht)
    ?datum=2026-12-06   -- ein anderer Tag: Nikolaus, zwei Kerzen, andere Zahl auf dem Schild
    ?schnell            -- Schlitten und Gaeste kommen alle paar Sekunden statt alle zwei Minuten
    ?steh               -- Schlitten und Gaeste stehen im Bild, zum Ansehen der Zeichnung
    ?still              -- "Hintergrund langsam bewegen" aus: nur, was stillsteht
    ?aus                -- ohne Anlass, zum Vergleich

  Bei 1280x854 ansehen, das ist die echte Panelgroesse.
-->
<link rel="stylesheet" href="../../renderer/shared/dashboard.css">
<link rel="stylesheet" href="../../renderer/shared/anlass.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  .stand { position: fixed; right: 1vh; top: 50%; z-index: 99999; writing-mode: vertical-rl;
    font: 500 1.3vh system-ui, sans-serif; color: #dde; background: rgba(0,0,0,0.55);
    padding: 1.2vh 0.5vh; border-radius: 0.8vh; pointer-events: none; }
</style>
</head>
<body class="wandanzeige">
  <div class="lebendig" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="app"><div class="main">
    <div class="grid" id="grid"></div>
    <div class="unterleiste" id="unterleiste"></div>
  </div></div>
  <div class="bildschirmschoner" id="bildschirmschoner">
    <div class="bs-buehne"></div><div class="bs-bild"></div><div class="bs-raster"></div>
    <div class="bs-inhalt"><div class="bs-karten" id="bsKarten"></div></div>
  </div>
  <div id="anlassSchicht"></div>
  <div class="stand" id="stand"></div>

<script src="../../renderer/shared/dashboard-render.js"></script>
<script src="../../renderer/shared/buehne.js"></script>
<script src="../../renderer/shared/anlass.js"></script>
<script>
const P = new URLSearchParams(location.search);
const alsDashboard = P.has('dashboard');
DashboardRender.applyCustomTheme(DashboardRender.DEFAULT_THEME);
if (P.has('still')) document.body.classList.add('ohne-bewegung');

const Z = (state, attributes = {}) => ({ state, attributes });
let saat = 7;
const zufall = () => { saat = (saat * 9301 + 49297) % 233280; return saat / 233280 - 0.5; };
const verlauf = (basis, schwankung) => Array.from({ length: 120 }, (_, i) =>
  ({ t: Date.now() - (120 - i) * 150000, v: basis + Math.sin(i / 16) * schwankung + zufall() * schwankung * 0.9 }));
// Dieselbe Mischung wie auf dem Schoner in Eurasburg: Messkarten mit Ort, eine Ringkarte, eine
// Lampe (damit der Aktiv-Schein auf Farbe zu sehen ist), Muell, Uhr.
const KARTEN = [
  ['sensor.temp_innen', 'temperature', Z('21.4', { friendly_name: 'Innentemperatur', unit_of_measurement: '°C' }), { ort: 'innen' }, { x: 0, y: 0, cols: 1, rows: 2 }, verlauf(21, 0.4)],
  ['sensor.temp_aussen', 'temperature', Z('-2.6', { friendly_name: 'Außentemperatur', unit_of_measurement: '°C' }), { ort: 'aussen' }, { x: 1, y: 0, cols: 1, rows: 2 }, verlauf(-2, 2)],
  ['sensor.feuchte_wz', 'humidity', Z('46', { friendly_name: 'Luftfeuchte', unit_of_measurement: '%' }), { ort: 'wohnzimmer' }, { x: 2, y: 0, cols: 1, rows: 2 }, verlauf(46, 3)],
  ['sensor.druck', 'pressure', Z('946.2', { friendly_name: 'Luftdruck', unit_of_measurement: 'hPa' }), { ort: 'treppenhaus' }, { x: 3, y: 0, cols: 1, rows: 2 }, verlauf(946, 1)],
  ['sensor.wind', 'wind', Z('14.6', { friendly_name: 'Wind', unit_of_measurement: 'km/h' }), { ort: 'aussen' }, { x: 0, y: 2, cols: 1, rows: 2 }, verlauf(14, 4)],
  ['sensor.uv', 'gauge', Z('3', { friendly_name: 'UV-Index', unit_of_measurement: '' }), { ort: 'aussen', min: 0, max: 11 }, { x: 1, y: 2, cols: 1, rows: 2 }, verlauf(3, 1)],
  ['light.stube', 'light', Z('on', { friendly_name: 'Stehlampe', brightness: 180, supported_color_modes: ['brightness'] }), {}, { x: 2, y: 2, cols: 1, rows: 2 }, null],
  ['sensor.regen', 'rain', Z('0.4', { friendly_name: 'Regen', unit_of_measurement: 'mm/h' }), { ort: 'aussen' }, { x: 3, y: 2, cols: 1, rows: 2 }, verlauf(0.4, 0.2)],
  ['calendar.muell', 'waste', Z('off'), {}, { x: 0, y: 4, cols: 2, rows: 2 }, null],
  ['sensor.wasser', 'sensor', Z('100.5', { friendly_name: 'Verbrauch heute', unit_of_measurement: 'L', device_class: 'water' }), {}, { x: 2, y: 4, cols: 1, rows: 2 }, verlauf(100, 4)],
  ['clock:1', 'clock', null, {}, { x: 3, y: 4, cols: 1, rows: 2 }, null]
];
const inTagen = (n) => { const d = new Date(Date.now() + n * 86400000); return d.toISOString().slice(0, 10); };
const MUELL = [{ start: inTagen(4), summary: 'Restabfall' }, { start: inTagen(4), summary: 'Papierabfall' }, { start: inTagen(18), summary: 'Verpackungstonne' }];
const bauen = ([id, typ, zustand, settings, pos, history]) => DashboardRender.buildCard(id, zustand, typ, pos, {
  editable: false, apiBase: '', statesById: {}, settings, callbacks: {}, history, waste: MUELL
});

const tag = P.get('datum') ? new Date(P.get('datum') + 'T12:00:00') : new Date();
const zustand = AnlassModul.anlassZustand(P.has('aus') ? 'aus' : 'weihnachten', tag);
document.body.classList.toggle('anlass-weihnachten', zustand.anlass === 'weihnachten');
document.body.classList.toggle('anlass-tag', P.has('tag') && zustand.anlass === 'weihnachten');

const bs = document.getElementById('bildschirmschoner');
let schicht;
if (alsDashboard) {
  KARTEN.forEach(k => document.getElementById('grid').appendChild(bauen(k)));
  document.getElementById('unterleiste').appendChild(bauen(['clock:2', 'clock', null, {}, { cols: 4, rows: 1 }, null]));
  schicht = document.getElementById('anlassSchicht');
  AnlassModul.schichtSetzen(schicht, zustand, { flocken: 36, szene: 'klein' });
} else {
  document.querySelector('.app').style.display = 'none';
  KARTEN.forEach(k => document.getElementById('bsKarten').appendChild(bauen(k)));
  bs.classList.add('bs-sichtbar');
  schicht = document.createElement('div');
  bs.appendChild(schicht);
  AnlassModul.schichtSetzen(schicht, zustand, { flocken: 48, szene: 'gross' });
  const buehne = new BuehneModul.Buehne(bs.querySelector('.bs-buehne'),
    { toene: zustand.anlass ? AnlassModul.BUEHNE_TOENE_WEIHNACHTEN : null });
  if (!P.has('still')) buehne.starten();
}

if (P.has('schnell')) {
  schicht.style.setProperty('--anlass-takt-schlitten', '24s');
  schicht.style.setProperty('--anlass-takt-ecke', '20s');
  // Die Wartezeit vor dem ersten Auftritt gleich mit kuerzen.
  schicht.querySelectorAll('.anlass-schlitten').forEach(e => e.style.animationDelay = '1s');
  schicht.querySelectorAll('.anlass-figur').forEach(e => e.style.animationDelay = '1s');
  schicht.querySelectorAll('.anlass-kranz').forEach(e => e.style.animationDelay = '11s');
}
if (P.has('steh')) {
  schicht.querySelectorAll('.anlass-ecke').forEach(e => { e.style.animation = 'none'; e.style.transform = 'translate3d(0, 8%, 0)'; });
  schicht.querySelectorAll('.anlass-schlitten').forEach(e => { e.style.animation = 'none'; e.style.transform = 'translate3d(34vw, 2vh, 0) rotate(-2deg)'; });
}
document.getElementById('stand').textContent = zustand.anlass
  ? `${tag.toLocaleDateString('de-DE')} · ${zustand.advent}. Advent · ${zustand.figur} · ${zustand.schild.gross}`
  : 'ohne Anlass';
</script>
</body>
</html>
