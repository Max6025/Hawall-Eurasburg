<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Statusseite – Probe</title>
<!--
  Der Dashboard-Typ "Status", ohne Home Assistant und ohne Electron. ECHTES Modul, ECHTES CSS
  -- eine Probe, die eine Kopie ansieht, beweist nichts (siehe .scratch/energiekarte).

  Die Frage hier ist NICHT, ob es gut aussieht, sondern ob es auf EINEN Bildschirm passt und
  ob man aus fünf Metern erkennt, dass etwas kaputt ist. Deshalb:

  ?fall=stoerung   drei Störungen aus der Sammel-Entität (Vorgabe)
  ?fall=ok         alles erreichbar
  ?fall=viele      60 Dienste -- die Kachelfläche an ihrer Grenze
  ?fall=wenige     5 Dienste -- die Kacheln dürfen dann nicht albern groß werden
  ?fall=leer       gar keine Überwachung gefunden
  ?hell            das helle Design
  ?weit            aus fünf Metern: alles auf ein Fünftel verkleinert

  Bei 1280x854 ansehen, das ist die echte Panelgröße -- `vh` rechnet auf das Browserfenster,
  nicht auf einen Kasten darin.
-->
<link rel="stylesheet" href="../../renderer/shared/dashboard.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif; }
  /* Dasselbe Geruest wie renderer/dashboard.html -- .app > .main > Ansicht + Unterleiste.
     Die Kopfzeile ist dort `display: none` und gibt ihren Platz vollstaendig ab; eine Probe
     mit Kopfzeile misst eine Flaeche, die es auf der Wand nicht gibt. */
  .knopfleiste { position: fixed; left: 0; top: 0; z-index: 99999; display: flex; gap: .4rem; padding: .4rem; }
  .knopfleiste a { font: 12px system-ui; color: #cde; background: #2228; padding: .3rem .6rem;
    border-radius: 6px; text-decoration: none; }
  .marke { position: fixed; left: 0; bottom: 0; right: 0; z-index: 99999;
    background: #000c; color: #9ab; font: 12px system-ui; padding: .4rem .8rem; }
  /* „Aus fünf Metern" lässt sich am Schreibtisch nur nachstellen, indem man alles klein
     macht. Die Frage ist dann nicht mehr, ob man die Zahlen liest, sondern ob man den
     Unterschied zwischen „grün" und „rot" sieht, ohne hinzusehen. */
  body.weit .app { zoom: 0.2; }
</style>
</head>
<body class="wandanzeige">
  <div class="knopfleiste">
    <a href="?fall=stoerung">Störung</a><a href="?fall=ok">alles ok</a>
    <a href="?fall=viele">60 Dienste</a><a href="?fall=wenige">5 Dienste</a>
    <a href="?fall=leer">nichts gefunden</a>
    <a href="?fall=stoerung&hell=1">hell</a><a href="?fall=stoerung&weit=1">weit weg</a>
    <a href="?fall=stoerung&ohneverlauf=1">ohne HA-Verlauf</a>
  </div>
  <div class="app"><div class="main">
    <header class="statusbar"><div id="title">Hausstatus</div></header>
    <div class="status-view" id="statusView"></div>
    <div class="unterleiste" id="unterleiste"></div>
  </div></div>
  <!-- Dasselbe Fenster wie in der Anzeige. Ohne das liesse sich hier nur der halbe Weg
       ansehen: Die Kachel ist anklickbar, und was dann kommt, ist das Eigentliche. -->
  <div class="dt-huelle" id="detailHuelle" hidden>
    <div class="dt-fenster" id="detailFenster" role="dialog" aria-modal="true">
      <button class="dt-zu" id="detailZuKnopf" aria-label="Schließen">✕</button>
      <div class="dt-inhalt" id="detailInhalt"></div>
    </div>
  </div>
  <div class="marke" id="marke"></div>
<script src="../../renderer/shared/dashboard-render.js"></script>
<script>
  const P = new URLSearchParams(location.search);
  const fall = P.get('fall') || 'stoerung';
  if (P.has('hell')) document.body.classList.add('light-theme');
  if (P.has('weit')) document.body.classList.add('weit');
  // Die Klasse setzt in der Anzeige `ansichtUmschalten()`. Ohne sie nimmt sich die
  // Unterleiste ihr `flex: 1` und damit die halbe Hoehe -- die Kacheln waeren auf einen
  // Streifen zusammengedrueckt, und die Probe haette einen Fehler gezeigt, den es nicht gibt.
  document.body.classList.add('status-an');

  const NAMEN = ['Home Assistant', 'HA Vater', 'Pi-hole', 'Fritzbox', 'NAS', 'Drucker',
    'Wallbox', 'Wechselrichter', 'Kamera Hof', 'Kamera Tor', 'Panel Eurasburg',
    'Panel Crespina', 'Uptime Kuma', 'Grafana', 'InfluxDB', 'Mosquitto', 'Zigbee2MQTT',
    'Node-RED', 'Wasseruhr', 'Garagen-ESP', 'Auto-ESP', 'Labor-Pi', 'Switch Keller',
    'AP Dach', 'AP Garage', 'Backup-Server', 'Nextcloud', 'Vaultwarden', 'Paperless',
    'Jellyfin', 'Steam-Cache', 'DNS extern', 'VPN', 'Mailserver', 'Webserver', 'Statusseite',
    'Wetterstation', 'Heizung', 'Solarbank', 'Pumpe', 'Alarmanlage', 'Türklingel',
    'Rasenmäher', 'Wasserzähler', 'Stromzähler', 'Gaszähler', 'Lüftung', 'Klima Büro',
    'Klima Schlafen', 'Lichtschranke', 'Tor Hof', 'Tor Garage', 'Rollladen', 'Markise',
    'Poolpumpe', 'Poolheizung', 'Sauna', 'Werkstatt', 'Hütte', 'Carport'];

  // Die Kennung so bilden, wie Home Assistant es täte -- aus dem übersetzten Namen.
  const kennung = (n) => 'sensor.' + n.toLowerCase()
    .replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

  function bauen(anzahl, kaputt) {
    const z = {};
    const setze = (id, state, attrs) => { z[id] = { entity_id: id, state, attributes: attrs || {} }; };
    NAMEN.slice(0, anzahl).forEach((name, i) => {
      const b = kennung(name);
      const zustand = kaputt.includes(name) ? 'down'
        : (i === 4 ? 'pending' : (i === 9 ? 'maintenance' : 'up'));
      setze(b + '_status', zustand, { friendly_name: name + ' Status' });
      // Seit wann dieser Zustand gilt -- Home Assistant liefert das an jeder Entität, und der
      // Balken fällt darauf zurück, wenn es keinen Verlauf gibt.
      z[b + '_status'].last_changed = new Date(Date.now() - (3 + (i % 7)) * 3600000).toISOString();
      setze(b + '_antwortzeit', String(Math.round(4 + Math.abs(Math.sin(i * 1.7)) * 480)),
        { friendly_name: name + ' Antwortzeit', unit_of_measurement: 'ms' });
      setze(b + '_verfugbarkeit_30_tage', (99.99 - Math.abs(Math.sin(i * 2.3)) * 3.4).toFixed(2),
        { friendly_name: name + ' Verfügbarkeit 30 Tage', unit_of_measurement: '%' });
      setze(b + '_uberwachungstyp', 'http', { friendly_name: name + ' Überwachungstyp' });
    });
    // Eine Gruppe -- sie darf NICHT als Kachel erscheinen.
    setze('sensor.alle_server_status', 'up', { friendly_name: 'Alle Server Status' });
    setze('sensor.alle_server_uberwachungstyp', 'group', { friendly_name: 'Alle Server Typ' });
    return z;
  }

  const SAMMLER = (kuma) => ({
    entity_id: 'sensor.netzwache_probleme',
    state: String(kuma.length + 2),
    attributes: {
      alle: kuma.concat(['Drucker', 'Wasseruhr']),
      kuma, integrationen: ['Drucker'], hardware: ['Wasseruhr'],
      kuma_monitore: 38
    }
  });

  let zustaende = {};
  if (fall === 'ok') {
    zustaende = bauen(24, []);
    // Ohne Störungen trägt die Sammel-Entität leere Listen -- genau so steht sie im Haus.
    zustaende['sensor.netzwache_probleme'] = {
      entity_id: 'sensor.netzwache_probleme', state: '0',
      attributes: { alle: [], kuma: [], integrationen: [], hardware: [], kuma_monitore: 24 }
    };
  } else if (fall === 'viele') {
    zustaende = bauen(60, ['NAS', 'Drucker']);
    zustaende['sensor.netzwache_probleme'] = SAMMLER(['NAS']);
  } else if (fall === 'wenige') {
    zustaende = bauen(5, []);
  } else if (fall === 'leer') {
    zustaende = {};
  } else {
    zustaende = bauen(38, ['HA Vater']);
    zustaende['sensor.netzwache_probleme'] = SAMMLER(['HA Vater']);
  }

  // Dieselbe Rechnung wie in dashboard.html: Das Seitenverhältnis kommt aus dem gemessenen
  // Kasten, nicht aus einer Zahl. Eine Probe mit eigener Rechnung prüft ihre eigene Rechnung.
  function zeichnen() {
    const el = document.getElementById('statusView');
    const k = el.getBoundingClientRect();
    el.innerHTML = DashboardRender.statusAnsicht(zustaende, {
      seitenverhaeltnis: k.height > 0 ? k.width / k.height : 0
    });
    const m = DashboardRender.statusMonitore(zustaende);
    const raster = DashboardRender.statusRaster(m.length, k.height > 0 ? k.width / k.height : 0);
    // Passt es WIRKLICH auf einen Bildschirm? Nicht schätzen -- nachmessen.
    const ueber = el.scrollHeight - el.clientHeight;
    document.getElementById('marke').textContent =
      `Fall "${fall}" · ${m.length} Dienste · Raster ${raster.spalten}×${raster.zeilen}`
      + ` · Fläche ${Math.round(k.width)}×${Math.round(k.height)} px`
      + ` · ${ueber > 1 ? '⚠ ' + ueber + ' px zu hoch (scrollt!)' : 'passt'}`;
    for (const kachel of el.querySelectorAll('.st-kachel[data-entity]')) {
      kachel.addEventListener('click', () => kachelOeffnen(kachel.dataset.entity));
    }
  }
  // --- Das Fenster hinter einer Kachel ----------------------------------------------------
  // Der Verlauf wird hier ERFUNDEN: ein paar Wechsel in den letzten 24 Stunden. Auf dem Gerät
  // kommt er aus Home Assistant (`/api/ha/history?...&text=1`).
  const JETZT = Date.now();
  // ?ohneverlauf stellt den Fall vom Gerät nach: Home Assistant gibt nichts her. Dann muss
  // der Balken trotzdem etwas zeigen -- aus `last_changed` der Entität.
  const OHNE_VERLAUF = P.has('ohneverlauf');
  function verlaufFuer(name) {
    if (OHNE_VERLAUF) return [];
    const b = kennung(name);
    const z = zustaende[b + '_status'];
    const ende = z ? z.state : 'up';
    // Ein kurzer Ausfall vor drei Stunden -- der Fall, an dem man sieht, ob ein Balkenfeld
    // ihn trägt oder verschluckt.
    return [
      { t: new Date(JETZT - 24 * 3600000).toISOString(), zustand: 'up' },
      { t: new Date(JETZT - 9 * 3600000).toISOString(), zustand: 'pending' },
      { t: new Date(JETZT - 8.6 * 3600000).toISOString(), zustand: 'up' },
      { t: new Date(JETZT - 3 * 3600000).toISOString(), zustand: 'down' },
      { t: new Date(JETZT - 3 * 3600000 + 180000).toISOString(), zustand: ende }
    ];
  }
  function msVerlaufFuer(i) {
    return Array.from({ length: 70 }, (_, k) => ({
      t: new Date(JETZT - (69 - k) * (24 * 3600000 / 69)).toISOString(),
      v: 40 + Math.sin(k / 6 + i) * 18 + Math.sin(k / 2.3) * 5
    }));
  }
  function kachelOeffnen(entityId) {
    const m = DashboardRender.statusMonitore(zustaende).find(x => x.entity_id === entityId);
    if (!m) return;
    document.getElementById('detailInhalt').innerHTML = DashboardRender.statusDetail({
      monitor: m, zustandsVerlauf: verlaufFuer(m.name),
      msVerlauf: msVerlaufFuer(m.name.length), stunden: 24, jetzt: JETZT
    });
    document.getElementById('detailHuelle').hidden = false;
    // Derselbe Tippstrich wie in der Anzeige -- die Kurve ist dieselbe Funktion.
    const box = document.querySelector('#detailInhalt .dt-verlauf-box');
    if (box) {
      const ziel = document.getElementById('detailInhalt');
      ziel.onpointerdown = (e) => {
        const b = e.target.closest && e.target.closest('.dt-verlauf-box');
        if (!b) return;
        const a = DashboardRender.verlaufStrichAnteil(b, e.clientX);
        if (a !== null) DashboardRender.verlaufStrichZeichnen(b, a);
      };
    }
  }
  document.getElementById('detailZuKnopf').addEventListener('click',
    () => { document.getElementById('detailHuelle').hidden = true; });
  document.getElementById('detailHuelle').addEventListener('click',
    (e) => { if (e.target.id === 'detailHuelle') document.getElementById('detailHuelle').hidden = true; });

  // Erst nach den Schriften messen: Vorher sind die Kästen noch nicht in ihrer Endgröße --
  // dieselbe Falle wie in .scratch/detailfenster (dort kam "Fenster 2×2 px" heraus).
  document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(zeichnen)));
  window.addEventListener('resize', zeichnen);
</script>
</body>
</html>
